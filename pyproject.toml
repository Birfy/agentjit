[project]
# The distribution is `agent-jit`; the import name and the CLI stay `agentjit`.
# (`agentjit` was already taken on PyPI by an unrelated project.)
name = "agent-jit"
version = "0.0.1"
description = "Compile a plain-text requirement into a reusable, verified, sandboxed function"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Birfy", email = "birfychen@gmail.com" }]
keywords = ["llm", "agent", "code-generation", "sandbox", "jit", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
]
# jsonschema is the only runtime dependency: it is the yardstick for both the input
# guard and the return-schema gate. `coverage` used to be here for the branch-coverage
# gate; that gate is gone, so the dependency went with it.
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5.1"]

[project.urls]
Homepage = "https://github.com/Birfy/agentjit"
Repository = "https://github.com/Birfy/agentjit"
Issues = "https://github.com/Birfy/agentjit/issues"
Changelog = "https://github.com/Birfy/agentjit/blob/main/CHANGELOG.md"

[project.scripts]
agentjit = "agentjit.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The corpus ships with the package so `agentjit selftest` works from a pip install,
# not only from a git checkout.
[tool.setuptools.package-data]
agentjit = ["corpus/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
