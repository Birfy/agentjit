[project]
name = "agentjit"
version = "0.1.0"
description = "Compile a plain-text requirement into a reusable, verified, sandboxed function"
requires-python = ">=3.11"
dependencies = ["coverage>=7.4", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentjit = "agentjit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
